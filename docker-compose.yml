name: gpu-accelerated-llm-serving

# Three-tier deployment:
#   streamlit -> api -> vllm (GPU) -> MiniCPM5-2B-GPTQ (AWQ 4-bit)
# Container-to-container traffic uses the internal service names, never
# 127.0.0.1. All model weights are downloaded from Hugging Face at runtime.

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.24.0}
    ipc: host
    restart: unless-stopped
    ports:
      - "9033:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      # Optional token for gated models; set a local .env value, never commit.
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${MODEL_ID:-openbmb/MiniCPM5-2B-GPTQ}
      - --quantization
      - awq
      - --dtype
      - float16
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEM_UTIL:-0.30}
      - --enforce-eager
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-512}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-openbmb/MiniCPM5-2B-GPTQ}
      - --port
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request as u;sys.exit(0 if u.urlopen('http://127.0.0.1:8000/v1/models',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    # GPU support (NVIDIA Container Toolkit required). The vllm service does
    # not run without GPU access.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      VLLM_BASE_URL: http://vllm:8000
      VLLM_MODEL_NAME: ${SERVED_MODEL_NAME:-openbmb/MiniCPM5-2B-GPTQ}
      VLLM_TIMEOUT: ${VLLM_TIMEOUT:-120}
    ports:
      - "8000:8000"
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request as u;sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      API_BASE_URL: http://api:8000
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request as u;sys.exit(0 if u.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hf-cache: